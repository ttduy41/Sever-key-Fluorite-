<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluorite - Multi Key System</title>
    <script src="database.js"></script>
    <style>
        body { background-color: #0b0e14; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; }
        .card { background: #161b22; width: 100%; max-width: 420px; border-radius: 20px; border: 1px solid #30363d; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; background: #1c2128; }
        .logo { font-size: 18px; font-weight: bold; color: #58a6ff; }
        .content { padding: 20px; }
        .section-title { font-size: 13px; color: #8b949e; margin-bottom: 8px; display: block; font-weight: bold; }
        
        select, input { width: 100%; padding: 12px; border-radius: 10px; background: #0d1117; color: #fff; border: 1px solid #30363d; margin-bottom: 12px; box-sizing: border-box; outline: none; }
        
        .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-bottom: 10px; font-size: 14px; transition: 0.2s; }
        .btn-get { background: #238636; color: #fff; }
        .btn-get:hover { background: #2ea043; }
        .btn-copy { background: #00bcd4; color: #fff; margin-top: 10px; }

        /* Khung hiển thị danh sách Key */
        .result-box { background: #0d1117; padding: 15px; border-radius: 12px; border: 1px solid #30363d; margin-top: 10px; display: none; }
        .key-list-area { 
            max-height: 200px; 
            overflow-y: auto; 
            text-align: left; 
            font-family: monospace; 
            color: #58a6ff; 
            font-size: 14px; 
            white-space: pre-wrap;
            line-height: 1.6;
            padding: 10px;
            background: #090c10;
            border-radius: 8px;
        }

        .check-section { margin-top: 25px; padding-top: 20px; border-top: 1px solid #30363d; }
        .btn-check { background: #8957e5; color: #fff; }
        #check-info { font-size: 12px; margin-top: 10px; color: #39d353; line-height: 1.5; }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <div class="logo">⚡ FLUORITE MULTI-KEY</div>
        <div style="font-size: 10px; color: #8b949e;">SERVER V3</div>
    </div>

    <div class="content">
        <span class="section-title">CHỌN THỜI GIAN</span>
        <select id="duration">
            <option value="day1">Gói 24 Giờ</option>
            <option value="day7">Gói 7 Ngày</option>
            <option value="day30">Gói 30 Ngày</option>
        </select>

        <span class="section-title">SỐ LƯỢNG KEY CẦN LẤY</span>
        <input type="number" id="quantity" value="1" min="1" max="100">

        <button class="btn btn-get" onclick="getMultiKeys()">XÁC NHẬN LẤY KEY</button>

        <div id="result-container" class="result-box">
            <span class="section-title" style="color:#58a6ff;">DANH SÁCH KEY KÍCH HOẠT:</span>
            <div id="key-display-area" class="key-list-area"></div>
            <button class="btn btn-copy" onclick="copyAllKeys()">SAO CHÉP TẤT CẢ</button>
        </div>

        <div class="check-section">
            <span class="section-title">KIỂM TRA THỜI HẠN KEY</span>
            <input type="text" id="keyToCheck" placeholder="Nhập 1 key để check...">
            <button class="btn btn-check" onclick="checkOneKey()">KIỂM TRA NGAY</button>
            <div id="check-info"></div>
        </div>
    </div>
</div>

<script>
    function getMultiKeys() {
        const type = document.getElementById('duration').value;
        const qty = parseInt(document.getElementById('quantity').value);
        const list = KEY_DATABASE[type];
        
        if (qty > list.length) {
            alert("Số lượng key trong kho không đủ! Chỉ còn " + list.length + " key.");
            return;
        }

        // Lấy ngẫu nhiên không trùng lặp
        let shuffled = [...list].sort(() => 0.5 - Math.random());
        let selectedKeys = shuffled.slice(0, qty);
        
        // Hiển thị ra màn hình
        const displayArea = document.getElementById('key-display-area');
        displayArea.innerText = selectedKeys.join('\n');
        document.getElementById('result-container').style.display = 'block';

        // Lưu thời gian cho từng key (giả lập)
        const now = new Date().getTime();
        selectedKeys.forEach(k => {
            localStorage.setItem(k, JSON.stringify({ startTime: now, type: type }));
        });
    }

    function copyAllKeys() {
        const text = document.getElementById('key-display-area').innerText;
        navigator.clipboard.writeText(text);
        alert("Đã sao chép tất cả key vào bộ nhớ tạm!");
    }

    function checkOneKey() {
        const k = document.getElementById('keyToCheck').value.trim();
        const infoDiv = document.getElementById('check-info');
        const data = localStorage.getItem(k);

        if (!data) {
            infoDiv.innerHTML = "<span style='color:#f85149;'>Key chưa tồn tại hoặc chưa kích hoạt!</span>";
            return;
        }

        const info = JSON.parse(data);
        const now = new Date().getTime();
        let dur = info.type === 'day1' ? 86400000 : (info.type === 'day7' ? 604800000 : 2592000000);
        const remain = (info.startTime + dur) - now;

        if (remain <= 0) {
            infoDiv.innerHTML = "<span style='color:#f85149;'>Key này đã hết hạn sử dụng!</span>";
        } else {
            const h = Math.floor(remain / 3600000);
            const m = Math.floor((remain % 3600000) / 60000);
            infoDiv.innerHTML = `Hợp lệ: <b>${info.type}</b><br>Còn lại: <b>${h} giờ ${m} phút</b>`;
        }
    }
</script>
</body>
</html>
